# docker compose up --build            -> web app on :3000, API on :8000 (SQLite + in-process EVM, demo)
# docker compose --profile postgres up  -> same stack with the API backed by PostgreSQL
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CHAIN_MODE: ${CHAIN_MODE:-LOCAL_EVM}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/sufficia.db}
    volumes:
      - sufficia-data:/data
      - ./deployments:/srv/deployments:ro
    restart: unless-stopped

  web:
    build:
      context: apps/web
    ports:
      - "3000:3000"
    environment:
      # read at runtime by the /api/v1 proxy; the browser never talks to the API directly
      SUFFICIA_API_URL: http://api:8000
      SUFFICIA_API_KEY: ${API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: sufficia
      POSTGRES_PASSWORD: sufficia
      POSTGRES_DB: sufficia
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sufficia"]
      interval: 5s
      retries: 10

volumes:
  sufficia-data:
  pg-data:

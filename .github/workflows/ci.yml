# CI gates (Document 06 §113): engine tests, benchmark 50/50, schema + canonicalization tests,
# smart-contract tests, integration, frontend build + browser end-to-end tests.
# Live-network tests stay separate (tests/live, manual).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - name: Build (solc 0.8.28) and verify committed artifacts
        run: |
          npm run build
          git diff --exit-code -- ../apps/api/sufficia/blockchain/artifacts
        working-directory: contracts
      - run: npm run check:foundry
        working-directory: contracts
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Foundry tests
        run: forge test -vv
        working-directory: contracts

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e "apps/api[dev]" -e packages/sdk/python
      - name: Benchmark fixtures are generated, not hand-edited
        run: python tests/benchmark/generate_fixtures.py --check
      - name: JSON Schemas / OpenAPI up to date
        run: python apps/api/scripts/export_schemas.py --check
      - name: Unit, property, adversarial, EVM and API tests
        run: python -m pytest -q -p no:cacheprovider
        working-directory: apps/api
      - name: Benchmark 50/50 (hermetic)
        run: python -m sufficia.benchmark --no-reports
        working-directory: apps/api
      - name: HTTP integration (real uvicorn process)
        run: python -m pytest -q -p no:cacheprovider tests/integration

  backend-windows:
    # Guards the Windows developer path: wheels only (no C toolchain), UTF-8 I/O, LF fixtures.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install from wheels only (fails if anything needs a C compiler)
        run: pip install --only-binary ":all:" -e "apps/api[dev]" -e packages/sdk/python
      - run: python tests/benchmark/generate_fixtures.py --check
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: apps/api
      - run: python -m sufficia.benchmark --no-reports
        working-directory: apps/api

  docker:
    # The production images and docker-compose.prod.yml, end to end: build, start, Grand Prize through the web proxy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production images
        run: |
          printf 'API_KEY=ci-key\nCHAIN_MODE=LOCAL_EVM\n' > .env
          docker network create proxy-network
          docker network create sufficia-network
          docker compose -f docker-compose.prod.yml build
      - name: No secret or local state inside the API image
        run: docker run --rm --entrypoint sh sufficia-api:latest -c 'test ! -e /srv/apps/api/.env && test ! -e /srv/apps/api/sufficia.db && test ! -d /srv/apps/web && echo clean'
      - name: Start the stack (waits for both health checks)
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 240
      - name: Grand Prize through the web proxy (web -> API -> in-process EVM)
        run: |
          docker compose -f docker-compose.prod.yml exec -T web node -e "
            fetch('http://127.0.0.1:3000/api/v1/demo/scenarios/grand-prize-v1/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
              .then((r) => r.json())
              .then((d) => { console.log(d.final_state, d.passed); process.exit(d.passed === true && d.final_state === 'AUTHORIZE' ? 0 : 1); })
              .catch((e) => { console.error(e); process.exit(1); });"
      - name: Mutating requests without the key are refused by the API
        run: |
          docker compose -f docker-compose.prod.yml exec -T web node -e "
            fetch('http://sufficia-api:8000/api/v1/intents', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{\"text\":\"x\"}' })
              .then((r) => { console.log(r.status); process.exit(r.status === 401 ? 0 : 1); });"
      - name: Logs
        if: always()
        run: docker compose -f docker-compose.prod.yml logs --no-color | tail -150

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: npm ci
        working-directory: apps/web
      - name: Lint, types, unit tests
        run: npm run lint && npm run typecheck && npm run test
        working-directory: apps/web
      - name: Frontend build
        run: npm run build
        working-directory: apps/web
      - name: API for end-to-end tests
        run: pip install -e "apps/api[dev]"
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser end-to-end (real API, in-process EVM, production web server)
        run: npx playwright test
        working-directory: apps/web
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e
          path: |
            ${{ runner.temp }}/screenshots
            apps/web/test-results
          if-no-files-found: ignore

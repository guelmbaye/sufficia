[profile.default]
src = "src"
test = "test"
script = "script"
out = "out-forge"
cache_path = "cache-forge"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/",
  "ds-test/=node_modules/@shunkakinoki/ds-test/",
]

[fuzz]
runs = 256

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sufficia-sdk"
version = "1.0.0"
description = "Minimal client for the SUFFICIA evidence-bound execution API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sufficia_sdk*"]
